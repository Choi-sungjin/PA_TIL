<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 회전 변환 디버깅 위젯</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent-x: #ef4444;
      --accent-y: #10b981;
      --accent-z: #3b82f6;
      --accent-vec: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .widget-container { background: var(--card-bg); width: 100%; max-width: 980px; border-radius: 20px; border: 1px solid #334155; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; }
    .header { padding: 18px 24px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .content-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; padding: 20px; }
    .canvas-box { position: relative; min-width: 0; background: #0b1120; border-radius: 14px; border: 1px solid #334155; height: 440px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    canvas { width: 100%; height: 100%; cursor: grab; touch-action: none; }
    canvas:active { cursor: grabbing; }
    .canvas-tip { position: absolute; bottom: 10px; left: 12px; font-size: 0.75rem; color: var(--text-muted); pointer-events: none; background: rgba(15,23,42,0.7); padding: 4px 8px; border-radius: 4px; }
    .panel { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
    .card { min-width: 0; background: #0f172a; border-radius: 12px; padding: 12px 16px; border: 1px solid #334155; }
    .card-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    .axis-selector { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .axis-btn { padding: 8px 0; border: 1px solid #334155; background: #1e293b; color: #fff; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
    .axis-btn.active-x { background: var(--accent-x); border-color: var(--accent-x); }
    .axis-btn.active-y { background: var(--accent-y); border-color: var(--accent-y); }
    .axis-btn.active-z { background: var(--accent-z); border-color: var(--accent-z); }
    .slider-row { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
    input[type=range] { flex: 1; accent-color: var(--accent-vec); height: 6px; border-radius: 3px; cursor: pointer; }
    .btn-group { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    button.sub-btn { background: #334155; color: #fff; border: none; padding: 5px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; transition: 0.2s; }
    button.sub-btn:hover { background: #475569; }
    button.sub-btn.active { background: var(--accent-vec); color: #000; font-weight: bold; }
    .matrix-display { font-family: 'Consolas', 'Courier New', monospace; font-size: 0.86rem; line-height: 1.6; color: #38bdf8; background: #050811; padding: 14px 16px; border-radius: 8px; white-space: pre; overflow-x: auto; }
    .matrix-label { color: #94a3b8; font-size: 0.78rem; }
    #matrixTitle { text-transform: none; }
    .warning-box { margin-top: 6px; font-size: 0.78rem; color: #f87171; background: rgba(239,68,68,0.1); padding: 4px 8px; border-radius: 4px; display: none; }
    @media (max-width: 820px) {
      .content-grid { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 480px) {
      body { padding: 8px; align-items: flex-start; }
      .widget-container { border-radius: 14px; }
      .header { padding: 14px 16px; gap: 6px; flex-direction: column; align-items: flex-start; }
      .content-grid { gap: 12px; padding: 12px; }
      .canvas-box { height: min(88vw, 360px); }
      .card { padding: 12px; }
      .axis-selector { gap: 6px; }
      .axis-btn { padding: 8px 4px; font-size: 0.78rem; }
      .matrix-display { padding: 12px 10px; font-size: 0.74rem; }
      .matrix-label { font-size: 0.7rem; }
    }
  </style>
</head>
<body>

<div class="widget-container">
  <div class="header">
    <h1>3D 회전 변환 디버깅 위젯</h1>
    <div style="font-size: 0.85rem; color: var(--text-muted);">오른손 법칙 검증</div>
  </div>

  <div class="content-grid">
    <div class="canvas-box">
      <canvas id="viewCanvas"></canvas>
      <div class="canvas-tip">🖱️ 마우스/터치 드래그: 3D 시점 회전</div>
    </div>

    <div class="panel">
      <!-- 1. 회전축 선택 -->
      <div class="card">
        <div class="card-title">1. 회전축 선택 (기준축)</div>
        <div class="axis-selector">
          <button class="axis-btn" id="btnAxisX" onclick="setAxis('X')">X축 회전 (Rx)</button>
          <button class="axis-btn" id="btnAxisY" onclick="setAxis('Y')">Y축 회전 (Ry)</button>
          <button class="axis-btn active-z" id="btnAxisZ" onclick="setAxis('Z')">Z축 회전 (Rz)</button>
        </div>
      </div>

      <!-- 2. 원래 점 선택 -->
      <div class="card">
        <div class="card-title">2. 회전시킬 원래 점 (v)</div>
        <div class="btn-group" id="vecButtonGroup">
          <button class="sub-btn active" id="btnV1" onclick="setBaseVec([1,0,0])">(1, 0, 0)</button>
          <button class="sub-btn" id="btnV2" onclick="setBaseVec([0,1,0])">(0, 1, 0)</button>
          <button class="sub-btn" id="btnV3" onclick="setBaseVec([0,0,1])">(0, 0, 1)</button>
        </div>
        <div class="warning-box" id="axisWarn">⚠️ 선택한 점이 회전축과 일치하여 점이 회전하지 않습니다!</div>
      </div>

      <!-- 3. 각도 조절 및 동적 버튼 -->
      <div class="card">
        <div class="card-title">3. 회전 각도 (θ)</div>
        <div class="slider-row">
          <input type="range" id="angleSlider" min="0" max="360" value="90">
          <span id="angleText" style="font-weight: bold; width: 50px;">90°</span>
        </div>
        <div class="btn-group" id="angleButtonGroup">
          <button class="sub-btn" id="btnDeg0" onclick="setAngle(0)">0°</button>
          <button class="sub-btn active" id="btnDeg90" onclick="setAngle(90)">90° (π/2)</button>
          <button class="sub-btn" id="btnDeg180" onclick="setAngle(180)">180°</button>
          <button class="sub-btn" id="btnDeg270" onclick="setAngle(270)">270°</button>
          <button class="sub-btn" id="btnAuto" onclick="toggleAuto()">▶ 자동 회전</button>
        </div>
      </div>

      <!-- 실시간 행렬 연산 구조 -->
      <div class="card">
        <div class="card-title" id="matrixTitle">Z축 회전 연산 구조</div>
        <div class="matrix-display" id="matrixDisplay"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('viewCanvas');
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('angleSlider');
  const angleText = document.getElementById('angleText');
  const matrixTitle = document.getElementById('matrixTitle');
  const matrixDisplay = document.getElementById('matrixDisplay');
  const axisWarn = document.getElementById('axisWarn');

  let currentAxis = 'Z';
  let baseVec = [1.0, 0.0, 0.0];
  let isAuto = false;
  let autoTimer = null;

  let camAzim = 45;
  let camElev = 25;
  let isDragging = false;
  let activePointerId = null;
  let prevMouseX = 0, prevMouseY = 0;
  let canvasWidth = 0, canvasHeight = 0;

  function resizeCanvas() {
    canvasWidth = canvas.parentElement.clientWidth || 460;
    canvasHeight = canvas.parentElement.clientHeight || 440;
    const pixelRatio = Math.max(1, window.devicePixelRatio || 1);
    const pixelWidth = Math.round(canvasWidth * pixelRatio);
    const pixelHeight = Math.round(canvasHeight * pixelRatio);

    if (canvas.width !== pixelWidth) canvas.width = pixelWidth;
    if (canvas.height !== pixelHeight) canvas.height = pixelHeight;
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  }
  window.addEventListener('resize', () => { resizeCanvas(); draw(); });

  function project3D(x, y, z, ox, oy, scale) {
    const radAzim = (camAzim * Math.PI) / 180;
    const radElev = (camElev * Math.PI) / 180;

    const x1 = x * Math.cos(radAzim) - z * Math.sin(radAzim);
    const z1 = x * Math.sin(radAzim) + z * Math.cos(radAzim);
    const y1 = y;

    const y2 = y1 * Math.cos(radElev) - z1 * Math.sin(radElev);
    return { x: ox + x1 * scale, y: oy - y2 * scale };
  }

  function getRotationMatrix(axis, theta) {
    const c = Math.cos(theta);
    const s = Math.sin(theta);
    if (axis === 'X') return [[1, 0, 0], [0, c, -s], [0, s, c]];
    if (axis === 'Y') return [[c, 0, s], [0, 1, 0], [-s, 0, c]];
    return [[c, -s, 0], [s, c, 0], [0, 0, 1]];
  }

  function multiplyMatVec(M, v) {
    return [
      M[0][0]*v[0] + M[0][1]*v[1] + M[0][2]*v[2],
      M[1][0]*v[0] + M[1][1]*v[1] + M[1][2]*v[2],
      M[2][0]*v[0] + M[2][1]*v[1] + M[2][2]*v[2]
    ];
  }

  function checkCollinear() {
    const axisIndex = { X: 0, Y: 1, Z: 2 }[currentAxis];
    const vectorLength = Math.hypot(...baseVec);
    const perpendicularLength = Math.hypot(
      ...baseVec.filter((_, index) => index !== axisIndex)
    );
    const isCollinear = vectorLength > 1e-10 && perpendicularLength < 1e-10;
    axisWarn.style.display = isCollinear ? 'block' : 'none';
  }

  // 각도 버튼 활성화 상태 실시간 동기화
  function updateAngleButtonHighlights(deg) {
    const rounded = Math.round(deg);
    const btn0 = document.getElementById('btnDeg0');
    const btn90 = document.getElementById('btnDeg90');
    const btn180 = document.getElementById('btnDeg180');
    const btn270 = document.getElementById('btnDeg270');

    if (btn0) btn0.classList.toggle('active', rounded === 0 || rounded === 360);
    if (btn90) btn90.classList.toggle('active', rounded === 90);
    if (btn180) btn180.classList.toggle('active', rounded === 180);
    if (btn270) btn270.classList.toggle('active', rounded === 270);
  }

  function draw() {
    if (!canvasWidth || !canvasHeight) resizeCanvas();
    ctx.clearRect(0, 0, canvasWidth, canvasHeight);
    const ox = canvasWidth / 2;
    const oy = canvasHeight / 2 + 10;
    const scale = Math.min(canvasWidth, canvasHeight) * 0.32;

    const deg = parseFloat(slider.value);
    const rad = (deg * Math.PI) / 180;

    const M = getRotationMatrix(currentAxis, rad);
    const vRot = multiplyMatVec(M, baseVec);

    // 회전 궤적
    ctx.beginPath();
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    for (let a = 0; a <= 360; a += 5) {
      const r = (a * Math.PI) / 180;
      const mTemp = getRotationMatrix(currentAxis, r);
      const pTemp = multiplyMatVec(mTemp, baseVec);
      const pt = project3D(pTemp[0], pTemp[1], pTemp[2], ox, oy, scale);
      if (a === 0) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // 축 렌더링
    function drawAxisLine(target, color, label, isCurrentAxis) {
      const p = project3D(target[0], target[1], target[2], ox, oy, scale);
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = isCurrentAxis ? 4 : 2;
      ctx.moveTo(ox, oy);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();

      ctx.fillStyle = color;
      ctx.font = isCurrentAxis ? 'bold 13px sans-serif' : '11px sans-serif';
      ctx.fillText(label + (isCurrentAxis ? ' (회전축)' : ''), p.x + 6, p.y + 4);
    }

    drawAxisLine([1.3, 0, 0], '#ef4444', '+X', currentAxis === 'X');
    drawAxisLine([0, 1.3, 0], '#10b981', '+Y', currentAxis === 'Y');
    drawAxisLine([0, 0, 1.3], '#3b82f6', '+Z', currentAxis === 'Z');

    // 원래 벡터
    const pOrig = project3D(baseVec[0], baseVec[1], baseVec[2], ox, oy, scale);
    ctx.beginPath();
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 2;
    ctx.setLineDash([2, 2]);
    ctx.moveTo(ox, oy);
    ctx.lineTo(pOrig.x, pOrig.y);
    ctx.stroke();
    ctx.setLineDash([]);

    // 회전된 벡터
    const pVec = project3D(vRot[0], vRot[1], vRot[2], ox, oy, scale);
    ctx.beginPath();
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 3.5;
    ctx.moveTo(ox, oy);
    ctx.lineTo(pVec.x, pVec.y);
    ctx.stroke();

    ctx.beginPath();
    ctx.fillStyle = '#f59e0b';
    ctx.arc(pVec.x, pVec.y, 6, 0, Math.PI * 2);
    ctx.fill();

    // UI 및 수식 업데이트
    angleText.innerText = `${deg.toFixed(0)}°`;
    matrixTitle.innerText = `${currentAxis}축 회전 연산 구조 (R${currentAxis.toLowerCase()}(θ) × v)`;

    const fmt = (num) => (Math.abs(num) < 1e-4 ? 0 : num).toFixed(2).padStart(5, ' ');
    const r0 = `[ ${fmt(M[0][0])}  ${fmt(M[0][1])}  ${fmt(M[0][2])} ]   [ ${baseVec[0]} ]     [ ${fmt(vRot[0])} ]`;
    const r1 = `[ ${fmt(M[1][0])}  ${fmt(M[1][1])}  ${fmt(M[1][2])} ] × [ ${baseVec[1]} ]  =  [ ${fmt(vRot[1])} ]`;
    const r2 = `[ ${fmt(M[2][0])}  ${fmt(M[2][1])}  ${fmt(M[2][2])} ]   [ ${baseVec[2]} ]     [ ${fmt(vRot[2])} ]`;
    const rLabel = `<span class="matrix-label">     (회전 행렬)         (원래 점)    (돌아간 결과)</span>`;

    matrixDisplay.innerHTML = `${r0}\n${r1}\n${r2}\n\n${rLabel}`;

    // 상태 체크 및 버튼 하이라이트 동기화
    checkCollinear();
    updateAngleButtonHighlights(deg);
  }

  function setAxis(axis) {
    currentAxis = axis;
    document.querySelectorAll('.axis-btn').forEach(b => b.className = 'axis-btn');
    document.getElementById(`btnAxis${axis}`).classList.add(`active-${axis.toLowerCase()}`);
    draw();
  }

  function setBaseVec(v) {
    baseVec = v;
    document.querySelectorAll('#vecButtonGroup .sub-btn').forEach(b => b.classList.remove('active'));
    if (v[0] === 1) document.getElementById('btnV1').classList.add('active');
    if (v[1] === 1) document.getElementById('btnV2').classList.add('active');
    if (v[2] === 1) document.getElementById('btnV3').classList.add('active');
    draw();
  }

  function setAngle(deg) {
    if (isAuto) toggleAuto();
    slider.value = deg;
    draw();
  }

  function toggleAuto() {
    isAuto = !isAuto;
    const btn = document.getElementById('btnAuto');
    if (isAuto) {
      btn.innerText = '⏸ 정지';
      btn.classList.add('active');
      autoTimer = setInterval(() => {
        slider.value = (parseFloat(slider.value) + 1) % 360;
        draw();
      }, 25);
    } else {
      btn.innerText = '▶ 자동 회전';
      btn.classList.remove('active');
      clearInterval(autoTimer);
    }
  }

  slider.addEventListener('input', () => {
    if (isAuto) toggleAuto();
    draw();
  });

  canvas.addEventListener('pointerdown', (e) => {
    if (activePointerId !== null || (e.pointerType === 'mouse' && e.button !== 0)) return;
    isDragging = true;
    activePointerId = e.pointerId;
    prevMouseX = e.clientX;
    prevMouseY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });

  function stopDragging(pointerId = activePointerId) {
    if (pointerId !== activePointerId) return;
    const capturedPointerId = activePointerId;
    isDragging = false;
    activePointerId = null;
    if (capturedPointerId !== null && canvas.hasPointerCapture(capturedPointerId)) {
      canvas.releasePointerCapture(capturedPointerId);
    }
  }

  canvas.addEventListener('pointerup', (e) => stopDragging(e.pointerId));
  canvas.addEventListener('pointercancel', (e) => stopDragging(e.pointerId));
  canvas.addEventListener('lostpointercapture', (e) => {
    if (e.pointerId === activePointerId) {
      isDragging = false;
      activePointerId = null;
    }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!isDragging || e.pointerId !== activePointerId) return;
    if (e.pointerType === 'mouse' && (e.buttons & 1) === 0) {
      stopDragging(e.pointerId);
      return;
    }
    camAzim = (camAzim + (e.clientX - prevMouseX) * 0.6) % 360;
    camElev = Math.max(-80, Math.min(80, camElev - (e.clientY - prevMouseY) * 0.6));
    prevMouseX = e.clientX;
    prevMouseY = e.clientY;
    draw();
  });
  window.addEventListener('blur', () => stopDragging());

  window.addEventListener('load', () => {
    resizeCanvas();
    draw();
  });
</script>
</body>
</html>
